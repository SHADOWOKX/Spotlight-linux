[workspace]
members = [
    "crates/spotlight-core",
    "crates/spotlight-gtk",
]
default-members = ["crates/spotlight-core"]
resolver = "3"

[workspace.package]
version = "0.1.1-preview.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/shadowokx/Spotlight-linux"

[workspace.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "gtk4", "global_shortcuts"] }
async-channel = "2.5.0"
criterion = { version = "0.8.2", default-features = false }
futures-util = "0.3.31"
gio-unix = "0.22.0"
gio = { version = "0.22.9", features = ["v2_80"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["process", "event"] }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "symbols"

[profile.release.package.spotlight-core]
opt-level = 3
